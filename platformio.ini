[platformio]
default_envs = epd_398_jd79665_c3_promini_ble

[common]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb_gallery.csv
board_build.filesystem = littlefs
board_build.extra_flags =
extra_scripts = post:merge_firmware.py

# ── 3.98" 768x552 BWRY (JD79665) 屏 软件模拟SPI驱动 ────────────────────────────
[env:epd_398_jd79665_c3_promini]
extends = common
board = esp32-c3-devkitm-1
build_flags =
    -DBOARD_PROFILE_ESP32_C3_HUAWEI
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_PANEL_JD79665
    -DEPD_BPP=2
    

[env:epd_398_jd79665_c3_std]
extends = common
board = esp32-c3-devkitm-1
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
    -DBOARD_PROFILE_ESP32_C3_HUAWEI
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_PANEL_JD79665
    -DEPD_BPP=2
    

# ── 蓝牙（BLE）固件：编译期二选一，与上面的 WiFi 固件互斥 ──────────────────────
# -DINKSIGHT_BLE 的固件完全不启动 WiFi，只跑 NimBLE；webapp.cpp / portal.cpp
# 用 build_src_filter 排除编译，WebServer/mDNS/lwIP 一点都不会进镜像。
#
# C3 是单射频，WiFi 和 BLE 同时开要抢天线、互相降速并显著发热，所以这里从编译期
# 就切成互斥的两套固件，而不是运行期共存。
#
# 依赖必须是 NimBLE 而不是内置 Bluedroid：app 分区 1.4375MB 已用 ~48.6%，
# NimBLE 约 +150KB 还在余量内，Bluedroid 会明显吃紧。
#
# 上位机是托管在 HTTPS 上的静态页（见 web/ble_test.html），用 Web Bluetooth 直连。
# 设备自带页面是 http://，属于非安全上下文，navigator.bluetooth 不存在，
# 所以蓝牙通道只能由外部 HTTPS 页面承载。
[env:epd_398_jd79665_c3_promini_ble]
extends = common
board = esp32-c3-devkitm-1
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
build_src_filter = +<*> -<webapp.cpp> -<portal.cpp>
build_flags =
    -DBOARD_PROFILE_ESP32_C3_HUAWEI
    -DINKSIGHT_BLE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_PANEL_JD79665
    -DEPD_BPP=2
    

[env:epd_398_jd79665_c3_std_ble]
extends = common
board = esp32-c3-devkitm-1
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 40000000L
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
build_src_filter = +<*> -<webapp.cpp> -<portal.cpp>
build_flags =
    -DBOARD_PROFILE_ESP32_C3_HUAWEI
    -DINKSIGHT_BLE
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DEPD_WIDTH=768
    -DEPD_HEIGHT=552
    -DEPD_PANEL_JD79665
    -DEPD_BPP=2


# ── NEW 型物理帧测试固件：验证屏幕是否为 800x600 物理结构 ─────────────────────
# 参考驱动对 new 型面板声明 800x600 分辨率、逻辑图写 X 偏移 32 处、边缘补白。
# 若竖条残影在该固件下消失，说明原固件按 768x552 声明少扫了 48 条物理 gate
# （屏是 new 型，可永久切到此路径）；若竖条原样保留，排除配置错配，指向屏体
# gate 驱动硬件。串口应见 "[EPD] PHYS800 test mode" 字样确认生效。
[env:epd_398_jd79665_c3_promini_ble_phys800]
extends = env:epd_398_jd79665_c3_promini_ble
build_flags =
    ${env:epd_398_jd79665_c3_promini_ble.build_flags}
    -DEPD_JD79665_PHYS800

